data_dir = "~/.local/share/computer-memory"

[git]
roots = ["~/Projects"]
max_depth = 3

[screenpipe]
enabled = true
url = "http://localhost:3030"
minutes = 180

# Ollama exposes an OpenAI-compatible endpoint at /v1 when enabled.
[llm]
base_url = "http://localhost:11434/v1"
model = "qwen3:14b"

[privacy]
excluded_app_patterns = ["(?i)^1password$", "(?i)^passwords$", "(?i)^keychain access$"]
excluded_url_patterns = ["(?i)paypal\\.com", "(?i)(^|\\.)bank", "(?i)accounts\\.google\\.com/signin", "(?i)/oauth/", "(?i)/2fa"]
